<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173c2c" />
  <meta name="description" content="FarmVoice — global agricultural research, locally validated." />
  <title>FarmVoice — TIKVARON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="FarmVoice home">
        <span class="brand-mark">F<span>v</span></span>
        <span><strong>farmvoice</strong><small>by TIKVARON</small></span>
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>Command centre</button>
        <button class="nav-item" data-page="network"><span class="nav-icon">◎</span>Research network</button>
        <button class="nav-item" data-page="library"><span class="nav-icon">▤</span>Knowledge library</button>
        <button class="nav-item" data-page="assistant"><span class="nav-icon">✳</span>FarmVoice assistant</button>
        <button class="nav-item" data-page="research"><span class="nav-icon">⌕</span>Research workspace</button>
        <button class="nav-item" data-page="evaluation"><span class="nav-icon">◷</span>Research &amp; evaluation</button>
        <button class="nav-item" data-page="presentation"><span class="nav-icon">▧</span>Partner presentation</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="stage-card"><span class="stage-dot"></span><div><b>Concept &amp; early research</b><small>Demonstration environment</small></div></div>
      <button class="profile-button" id="profileButton"><span class="avatar">T</span><span><b>TIKVARON team</b><small>Local demo workspace</small></span><span class="more">···</span></button>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>FarmVoice</span><span class="crumb-slash">/</span><b id="crumbTitle">Command centre</b></div>
        <div class="top-actions"><span class="demo-pill"><i></i> Synthetic data</span><button class="icon-button" id="helpButton" aria-label="About this demo">?</button></div>
      </header>
      <div class="content" id="content" tabindex="-1"></div>
      <footer class="footer"><span>FarmVoice · TIKVARON</span><span>Global research. Local validation. Farmer-centred delivery.</span><button id="limitationsButton">Demo limits &amp; data</button></footer>
    </main>
  </div>

  <dialog id="modal" class="modal"><form method="dialog"><button class="modal-close" aria-label="Close">×</button></form><div id="modalBody"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
